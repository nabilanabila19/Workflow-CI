name: SumselFire CI Training Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib

      - name: Run MLflow Project
        run: |
          mlflow run MLProject/ \
            --env-manager=local \
            --experiment-name=sumselfire-fire-risk-ci \
            -P data_path=fire_risk_dataset_preprocessing/fire_risk_preprocessed.csv

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            MLProject/mlruns/
            MLProject/confusion_matrix.png
            MLProject/feature_importance.png
            MLProject/classification_report.txt

      - name: Commit mlruns to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/mlruns/
          git diff --staged --quiet || git commit -m "ci: update mlruns artifacts [skip ci]"
          git push  
